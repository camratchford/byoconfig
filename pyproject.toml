[project]
name = "byoconfig"
dynamic = ["version"]
description = "A configuration class supporting multiple file formats, environment variables, AWS Secrets Manager, singletons, and more."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Cam Ratchford", email = "camratchford@gmail.com"},
]
keywords = ["config", "yaml", "toml", "json", "environment", "secrets-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: File Formats",
]

dependencies = [
    "PyYAML",
    "toml",
    "boto3"
]

[project.urls]
Homepage = "https://github.com/camratchford/byoconfig"
Source = "https://github.com/camratchford/byoconfig"

[project.optional-dependencies]
development = [
    "ruff",
    "isort",
    "pytest",
    "pytest-cov"
]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["byoconfig", "byoconfig.sources"]
package-dir = {"byoconfig" = "byoconfig", "byoconfig.sources" = "byoconfig/sources"}

[tool.setuptools_scm]


[tool.ruff]
exclude = [
    "tests/fixtures/**/*"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.isort]
profile = "black"
line_length = 119
skip_gitignore = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["byoconfig"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
]
